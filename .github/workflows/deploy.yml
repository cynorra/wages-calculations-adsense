name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 13 * * *" # Her gun TSI 16:05'te otomatik yayin
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate daily high-quality statutory guide
        run: node scripts/blog-generator.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit new article to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Auto-Publisher"
          git add src/content/guides/
          git diff-index --quiet HEAD || git commit -m "chore(content): auto-publish daily peer-reviewed wage guide [skip ci]"
          git push || true

      - run: npm test

      - name: Build site with Supabase articles
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "wages-calculations-adsense"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ping Search Engines via IndexNow
        run: node scripts/indexnow.mjs

